## Riverheim Config wild preset: Hurricane
## Spiral arms of land whirling around a mountainous core.
## Not checked for boss and trader locations (Moder's altar, Hildir's cave and camp, the Bog Witch); low or flat land can leave one with nowhere to place.
## Uses TileSpacing 25 (default 60): creating the world takes several times longer than usual.
## Far from stock Riverheim. Generated on seeds 400, 1337 and 2024 with Riverheim 1.2.1; try your seed in the AtlasBuilder UI first.
## Copy over BepInEx/config/com.valheim.riverheim.config.cfg, or load it with the AtlasBuilder UI's Import config.
