## Riverheim Config preset: Heartland
## One big continent with a solid Black Forest heartland and a ring of Plains and Mistlands outside. Biome patches are much bigger than stock, and Meadows twice as common.
## Copy over BepInEx/config/com.valheim.riverheim.config.cfg, or load it with the AtlasBuilder UI's Import config.
## Settings not listed stay at Riverheim's own values.

[5. Biome Amounts]
MeadowsWeight = 140

[6. Biome Bands]
PlainsStart = 40
MeadowsFadeEnd = 65

[7. Landmass]
SmallIslandSizeThreshold = 4000
CoastalTrimDistance = 0

[11. Terrain]
LandSlope = 2.5
