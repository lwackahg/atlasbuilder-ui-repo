## Riverheim Config preset: Tidy Biomes
## The same world with bigger, cleaner biome patches: tiny islands removed, Black Forest in about half as many patches.
## Copy over BepInEx/config/com.valheim.riverheim.config.cfg, or load it with the AtlasBuilder UI's Import config.
## Settings not listed stay at Riverheim's own values.

[6. Biome Bands]
PlainsStart = 34

[7. Landmass]
SmallIslandSizeThreshold = 1200
CoastalTrimDistance = 40

[11. Terrain]
LandSlope = 1.8
